  <g fill="#eac26a">
    <path d="M296 76L300 87L311 91L300 95L296 106L292 95L281 91L292 87Z"/>
    <path d="M780 177L783 185L791 188L783 191L780 199L777 191L769 188L777 185Z"/>
    <circle cx="688" cy="70" r="4"/>
    <circle cx="191" cy="184" r="4"/>
    <circle cx="547" cy="74" r="3"/>
  </g>
</svg>
