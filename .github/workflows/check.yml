name: Check

on:
  # PR branches are checked by their pull_request run; push covers main only.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r companion/requirements-dev.txt
      - run: make check PYTHON=python
      # Lockfiles must match their .in files. Resolution doesn't depend on the runner's
      # Python, so one leg is enough. uv is pinned: its output format can change.
      - if: matrix.python == '3.14'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.5'
          enable-cache: false
      - if: matrix.python == '3.14'
        run: make lock-check
